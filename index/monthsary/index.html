<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our First Monthsary 🌷</title>
    <style>
        body {
            background-color: #fff0f5;
            color: #d63384;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.15);
            text-align: center;
            max-width: 550px;
            width: 90%;
            border: 2px solid #ffb6c1;
            margin: 20px 0;
        }
        h1, h3 {
            color: #ff1493;
        }
        pre {
            font-family: monospace;
            color: #ff69b4;
            line-height: 1.2;
            font-size: 13px;
            margin: 20px 0;
        }
        .choice-btn {
            display: block;
            width: 100%;
            background-color: #fff0f5;
            color: #d63384;
            border: 1px solid #ffb6c1;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s;
        }
        .choice-btn:hover {
            background-color: #ff69b4;
            color: white;
        }
        button.main-btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            margin-top: 15px;
        }
        button.main-btn:hover {
            background-color: #ff1493;
        }
        .letter {
            text-align: left;
            white-space: pre-wrap;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #4a4a4a;
            background: #fff8fa;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #ffb6c1;
            max-height: 250px;
            overflow-y: auto;
        }
        #feedback {
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container" id="main-box">
    <h1>🌷 Pink Tulip Protocol</h1>
    <div id="content">
        <p>Cultivating digital soil & growing something special for you...</p>
        <button class="main-btn" onclick="startExperience()">Open Garden ✨</button>
    </div>
</div>

<script>
    const bouquetASCII = `
       (      )      (      )      
     _(_)_  _(_)_  _(_)_  _(_)_    
    ( 🌷 )( 🌷 )( 🌷 )( 🌷 )   
     \`---'  \`---'  \`---'  \`---'    
       |      |      |      |      
       \\      |      |      /      
        \\     |      |     /       
         \\_____#_____/        
          \\         /          
           \`-------'           
    `;

    function startExperience() {
        const content = document.getElementById("content");
        content.innerHTML = `<p>Blooming your bouquet...</p><pre id="ascii-art"></pre>`;
        
        let lines = bouquetASCII.trim().split("\n");
        let currentText = "";
        let i = 0;
        
        let interval = setInterval(() => {
            if (i < lines.length) {
                currentText += lines[i] + "\n";
                document.getElementById("ascii-art").innerText = currentText;
                i++;
            } else {
                clearInterval(interval);
                setTimeout(showQuiz, 1500);
            }
        }, 300);
    }

    // List of questions with choices and the exact correct choice index (0-3)
    const questions = [
        {
            title: "Question 1 of 5",
            question: "When was our very first meet?",
            choices: ["July 15", "August 7", "August 20", "September 1"],
            correct: 1
        },
        {
            title: "Question 2 of 5",
            question: "What flower did you receive from me?",
            choices: ["Sunflower", "Tulip", "Rose", "Daisy"],
            correct: 2
        },
        {
            title: "Question 3 of 5",
            question: "What movie did we watch together?",
            choices: ["Spider-Man", "The Avengers", "Titanic", "Interstellar"],
            correct: 0
        },
        {
            title: "Question 4 of 5",
            question: "When did you said yes?",
            choices: ["August 7", "August 30", "September 6", "September 15"],
            correct: 2
        },
        {
            title: "Question 5 of 5",
            question: "How deep is my love to you?",
            choices: ["To the moon and back", "Like the ocean", "Infinity", "More than words"],
            correct: 2
        }
    ];

    let currentQuestionIdx = 0;

    function showQuiz() {
        if (currentQuestionIdx >= questions.length) {
            showLetter();
            return;
        }

        let q = questions[currentQuestionIdx];
        const content = document.getElementById("content");
        
        let choicesHTML = "";
        q.choices.forEach((choice, index) => {
            choicesHTML += `<button class="choice-btn" onclick="checkAnswer(${index})">${choice}</button>`;
        });

        content.innerHTML = `
            <h3 style="margin-bottom: 5px;">${q.title}</h3>
            <p style="font-weight: bold; color: #d63384;">${q.question}</p>
            <div style="text-align: left; margin-top: 15px;">
                ${choicesHTML}
            </div>
            <p id="feedback"></p>
        `;
    }

    function checkAnswer(selectedIndex) {
        let q = questions[currentQuestionIdx];
        if (selectedIndex === q.correct) {
            currentQuestionIdx++;
            setTimeout(showQuiz, 400);
        } else {
            let feedbackEl = document.getElementById("feedback");
            feedbackEl.style.color = "#ff1493";
            feedbackEl.innerText = "Oops! Try another choice, love! ❤️";
        }
    }

    function showLetter() {
        const content = document.getElementById("content");
        content.innerHTML = `
            <h3>Garden Unlocked: Love.exe 💌</h3>
            <div class="letter">Happy First Monthsary!

Just like these pink tulips, you've brought so much brightness, warmth, and color into my life this past month. It honestly feels surreal that it's only been 30 days, because every single moment with you feels completely natural and wonderful.

Thank you for being my favorite part of every day. I can't wait to watch us grow and create so many more beautiful memories together.

Forever yours,
Yenyen</div>
        `;
    }
</script>

</body>
</html>
